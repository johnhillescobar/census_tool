name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/miniconda3
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv run python -m spacy download en_core_web_sm

      - name: Show LangChain version
        run: |
          uv run python -c "import langchain; print('LangChain version:', langchain.__version__)"

      - name: Create required directories
        run: |
          mkdir -p chroma memory data

      - name: Lint with flake8
        run: |
          uv run flake8 src app_test_scripts app.py main.py streamlit_app.py launcher.py cat_det.py --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 src app_test_scripts app.py main.py streamlit_app.py launcher.py cat_det.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with ruff
        run: |
          uv run ruff check src app_test_scripts

      - name: Test with pytest
        run: |
          uv run pytest app_test_scripts/ -v -m "not integration"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/miniconda3
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv run python -m spacy download en_core_web_sm

      - name: Create required directories
        run: |
          mkdir -p chroma memory data

      - name: Build application
        run: |
          echo "Building census tool application..."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: census-tool-build
          path: |
            src/
            *.py
            pyproject.toml
            uv.lock
            requirements.txt
          retention-days: 30
